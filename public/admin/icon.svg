<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="adminBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090814" />
      <stop offset="50%" stop-color="#180b20" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="sakuraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#adminBgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="rgba(244,63,94,0.35)" stroke-width="6" />

  <g filter="url(#sakuraGlow)">
    <!-- Admin Control Ring -->
    <circle cx="256" cy="256" r="176" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-dasharray="24 12" />

    <!-- 5 Sakura Cherry Blossom Petals -->
    <g transform="translate(256, 256)">
      <!-- Petal 1 (Top) -->
      <path d="M 0,0 C -35,-80 -55,-150 0,-175 C 55,-150 35,-80 0,0" fill="url(#sakuraGrad)" />
      <!-- Petal 2 (Top Right) -->
      <g transform="rotate(72)">
        <path d="M 0,0 C -35,-80 -55,-150 0,-175 C 55,-150 35,-80 0,0" fill="url(#sakuraGrad)" />
      </g>
      <!-- Petal 3 (Bottom Right) -->
      <g transform="rotate(144)">
        <path d="M 0,0 C -35,-80 -55,-150 0,-175 C 55,-150 35,-80 0,0" fill="url(#sakuraGrad)" />
      </g>
      <!-- Petal 4 (Bottom Left) -->
      <g transform="rotate(216)">
        <path d="M 0,0 C -35,-80 -55,-150 0,-175 C 55,-150 35,-80 0,0" fill="url(#sakuraGrad)" />
      </g>
      <!-- Petal 5 (Top Left) -->
      <g transform="rotate(288)">
        <path d="M 0,0 C -35,-80 -55,-150 0,-175 C 55,-150 35,-80 0,0" fill="url(#sakuraGrad)" />
      </g>

      <!-- Center Administrative Disc -->
      <circle cx="0" cy="0" r="54" fill="#0f172a" stroke="#fff" stroke-width="6" />
      <!-- Emerald Active Core -->
      <circle cx="0" cy="0" r="28" fill="#10b981" />
      <circle cx="-6" cy="-6" r="8" fill="#ffffff" opacity="0.8" />

      <!-- 4 High-Tech Nodes -->
      <circle cx="0" cy="-176" r="10" fill="#38bdf8" />
      <circle cx="176" cy="0" r="10" fill="#ec4899" />
      <circle cx="0" cy="176" r="10" fill="#38bdf8" />
      <circle cx="-176" cy="0" r="10" fill="#ec4899" />
    </g>
  </g>
</svg>
